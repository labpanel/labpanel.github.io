<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arctic North</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000510;
      cursor: none;
      font-family: 'Courier New', monospace;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #particles {
      z-index: 8;
      pointer-events: none;
    }

    /* Snowflake cursor */
    #cursor {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      animation: spin 8s linear infinite;
    }
    #cursor svg {
      width: 38px; height: 38px;
      filter: drop-shadow(0 0 6px rgba(140,210,255,0.9));
    }

    @keyframes spin {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to   { transform: translate(-50%,-50%) rotate(360deg); }
    }

    /* Scanlines */
    .scanlines {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 5;
    }

    /* Corner brackets */
    .corner {
      position: fixed;
      width: 50px; height: 50px;
      pointer-events: none;
      z-index: 20;
    }
    .corner.tl { top:20px; left:20px;   border-top:1px solid rgba(160,220,255,0.4); border-left:1px solid rgba(160,220,255,0.4); }
    .corner.tr { top:20px; right:20px;  border-top:1px solid rgba(160,220,255,0.4); border-right:1px solid rgba(160,220,255,0.4); }
    .corner.bl { bottom:20px; left:20px;  border-bottom:1px solid rgba(160,220,255,0.4); border-left:1px solid rgba(160,220,255,0.4); }
    .corner.br { bottom:20px; right:20px; border-bottom:1px solid rgba(160,220,255,0.4); border-right:1px solid rgba(160,220,255,0.4); }

    /* Overlay content */
    .overlay {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .title {
      font-size: clamp(2.5rem, 7vw, 6rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      color: #fff;
      text-shadow:
        0 0 30px rgba(100,180,255,0.9),
        0 0 80px rgba(100,180,255,0.4),
        0 0 120px rgba(80,120,255,0.2);
      animation: title-glow 4s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 0.8rem;
      font-size: clamp(0.7rem, 1.8vw, 1rem);
      color: rgba(160,220,255,0.6);
      letter-spacing: 0.5em;
      text-transform: uppercase;
    }

    .divider {
      margin-top: 1.5rem;
      width: 200px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(160,220,255,0.5), transparent);
    }

    .terminal-line {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(160,220,255,0.7);
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .blink {
      display: inline-block;
      width: 8px; height: 1em;
      background: rgba(160,220,255,0.8);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%,100% { opacity:1; } 50% { opacity:0; }
    }
    @keyframes title-glow {
      0%,100% { text-shadow: 0 0 30px rgba(100,180,255,0.9), 0 0 80px rgba(100,180,255,0.4); }
      50%      { text-shadow: 0 0 50px rgba(120,200,255,1),   0 0 120px rgba(100,180,255,0.6), 0 0 200px rgba(80,120,255,0.3); }
    }

    /* Status bar */
    .statusbar {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 2.5rem;
      font-size: 0.65rem;
      color: rgba(160,220,255,0.4);
      letter-spacing: 0.2em;
      z-index: 20;
      pointer-events: none;
    }

    /* Temperature display */
    .temp {
      position: fixed;
      top: 28px; right: 80px;
      font-size: 0.7rem;
      color: rgba(160,220,255,0.5);
      letter-spacing: 0.15em;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>
  <canvas id="particles"></canvas>
  <div class="scanlines"></div>

  <!-- Snowflake cursor -->
  <div id="cursor">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- main axes -->
      <line x1="50" y1="5"  x2="50" y2="95" stroke="rgba(180,230,255,0.95)" stroke-width="3" stroke-linecap="round"/>
      <line x1="5"  y1="50" x2="95" y2="50" stroke="rgba(180,230,255,0.95)" stroke-width="3" stroke-linecap="round"/>
      <line x1="18" y1="18" x2="82" y2="82" stroke="rgba(180,230,255,0.95)" stroke-width="3" stroke-linecap="round"/>
      <line x1="82" y1="18" x2="18" y2="82" stroke="rgba(180,230,255,0.95)" stroke-width="3" stroke-linecap="round"/>
      <!-- branches top -->
      <line x1="50" y1="22" x2="40" y2="12" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="22" x2="60" y2="12" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <!-- branches bottom -->
      <line x1="50" y1="78" x2="40" y2="88" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="78" x2="60" y2="88" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <!-- branches left -->
      <line x1="22" y1="50" x2="12" y2="40" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="50" x2="12" y2="60" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <!-- branches right -->
      <line x1="78" y1="50" x2="88" y2="40" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <line x1="78" y1="50" x2="88" y2="60" stroke="rgba(180,230,255,0.8)" stroke-width="2" stroke-linecap="round"/>
      <!-- center dot -->
      <circle cx="50" cy="50" r="4" fill="rgba(220,245,255,1)"/>
      <!-- tips -->
      <circle cx="50" cy="5"  r="2.5" fill="rgba(180,230,255,0.9)"/>
      <circle cx="50" cy="95" r="2.5" fill="rgba(180,230,255,0.9)"/>
      <circle cx="5"  cy="50" r="2.5" fill="rgba(180,230,255,0.9)"/>
      <circle cx="95" cy="50" r="2.5" fill="rgba(180,230,255,0.9)"/>
      <circle cx="18" cy="18" r="2.5" fill="rgba(180,230,255,0.9)"/>
      <circle cx="82" cy="82" r="2.5" fill="rgba(180,230,255,0.9)"/>
      <circle cx="82" cy="18" r="2.5" fill="rgba(180,230,255,0.9)"/>
      <circle cx="18" cy="82" r="2.5" fill="rgba(180,230,255,0.9)"/>
    </svg>
  </div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="overlay">
    <div class="title">ARCTIC</div>
    <div class="subtitle">78°N — North Pole Expedition</div>
    <div class="divider"></div>
    <div class="terminal-line">
      <span>polar@station:~$</span>
      <span id="typed"></span>
      <span class="blink"></span>
    </div>
  </div>

  <div class="temp" id="temp">−42°C &nbsp;|&nbsp; WIND 38 KT</div>

  <div class="statusbar">
    <span id="coords">LAT: 90.000°N</span>
    <span>AURORA: ACTIVE</span>
    <span id="clock"></span>
  </div>

  <script>
  // ── Cursor ───────────────────────────────────────────────────
  const cursorEl = document.getElementById('cursor');
  let mx = innerWidth/2, my = innerHeight/2, cx = mx, cy = my;
  let vx = 0, vy = 0; // cursor velocity for particle direction

  document.addEventListener('mousemove', e => {
    vx = e.clientX - mx;
    vy = e.clientY - my;
    mx = e.clientX; my = e.clientY;
    document.getElementById('coords').textContent =
      `X: ${mx} &nbsp;Y: ${my}`;
  });

  (function animCursor() {
    cx += (mx - cx) * 0.1;
    cy += (my - cy) * 0.1;
    cursorEl.style.left = cx + 'px';
    cursorEl.style.top  = cy + 'px';
    requestAnimationFrame(animCursor);
  })();

  // ── Cursor Particles ─────────────────────────────────────────
  const pCanvas = document.getElementById('particles');
  const pCtx    = pCanvas.getContext('2d');
  pCanvas.width  = innerWidth;
  pCanvas.height = innerHeight;
  window.addEventListener('resize', () => {
    pCanvas.width  = innerWidth;
    pCanvas.height = innerHeight;
  });

  const PARTICLE_TYPES = ['crystal', 'flake', 'spark'];
  const particles = [];

  function spawnParticles() {
    const speed = Math.sqrt(vx*vx + vy*vy);
    const count = Math.min(Math.floor(speed * 0.4) + 1, 6);
    for (let i = 0; i < count; i++) {
      const type = PARTICLE_TYPES[Math.floor(Math.random() * PARTICLE_TYPES.length)];
      const angle = Math.atan2(vy, vx) + (Math.random() - 0.5) * Math.PI * 1.2;
      const spd   = Math.random() * 2.5 + 0.5;
      particles.push({
        x: mx, y: my,
        vx: Math.cos(angle) * spd * -0.6 + (Math.random()-0.5) * 1.5,
        vy: Math.sin(angle) * spd * -0.6 + (Math.random()-0.5) * 1.5 - 0.5,
        life: 1,
        decay: Math.random() * 0.018 + 0.012,
        size: Math.random() * 3 + 1,
        type,
        hue: 190 + Math.random() * 40,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.15,
      });
    }
  }

  document.addEventListener('mousemove', spawnParticles);

  function drawSnowflakeParticle(ctx, x, y, size, alpha, rotation, hue) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = `hsla(${hue},100%,85%,1)`;
    ctx.lineWidth = size * 0.25;
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, size);
      // small branches
      ctx.moveTo(0, size * 0.5);
      ctx.lineTo(size * 0.3, size * 0.3);
      ctx.moveTo(0, size * 0.5);
      ctx.lineTo(-size * 0.3, size * 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCrystalParticle(ctx, x, y, size, alpha, rotation, hue) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = `hsla(${hue},100%,90%,1)`;
    ctx.fillStyle   = `hsla(${hue},100%,90%,0.15)`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.5, 0);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawSparkParticle(ctx, x, y, size, alpha, hue) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(x, y, 0, x, y, size * 2);
    g.addColorStop(0,   `hsla(${hue},100%,95%,1)`);
    g.addColorStop(0.4, `hsla(${hue},100%,75%,0.6)`);
    g.addColorStop(1,   `hsla(${hue},100%,65%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, size * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function animParticles() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.04; // gravity
      p.vx *= 0.98;
      p.life -= p.decay;
      p.rotation += p.rotSpeed;

      if (p.life <= 0) { particles.splice(i, 1); continue; }

      const alpha = p.life * p.life; // ease out

      if (p.type === 'flake') {
        drawSnowflakeParticle(pCtx, p.x, p.y, p.size * 2.5, alpha, p.rotation, p.hue);
      } else if (p.type === 'crystal') {
        drawCrystalParticle(pCtx, p.x, p.y, p.size * 2, alpha, p.rotation, p.hue);
      } else {
        drawSparkParticle(pCtx, p.x, p.y, p.size, alpha, p.hue);
      }
    }

    requestAnimationFrame(animParticles);
  }
  animParticles();

  // ── Clock ────────────────────────────────────────────────────
  setInterval(() => {
    document.getElementById('clock').textContent =
      new Date().toTimeString().slice(0,8) + ' UTC';
  }, 1000);

  // ── Typing ───────────────────────────────────────────────────
  const phrases = [
    'scanning aurora borealis...',
    'temperature: −42°C',
    'ice thickness: 3.2m',
    'magnetic north detected...',
    'polar vortex stabilizing...',
  ];
  let pi=0, ci=0, del=false;
  const typedEl = document.getElementById('typed');
  function type() {
    const p = phrases[pi];
    if (!del) {
      typedEl.textContent = p.slice(0, ++ci);
      if (ci === p.length) { del=true; setTimeout(type,2000); return; }
    } else {
      typedEl.textContent = p.slice(0, --ci);
      if (ci === 0) { del=false; pi=(pi+1)%phrases.length; }
    }
    setTimeout(type, del ? 35 : 65);
  }
  type();

  // ── Canvas ───────────────────────────────────────────────────
  const canvas = document.getElementById('bg');
  const ctx    = canvas.getContext('2d');
  let W = canvas.width  = innerWidth;
  let H = canvas.height = innerHeight;
  window.addEventListener('resize', () => {
    W = canvas.width  = innerWidth;
    H = canvas.height = innerHeight;
    initMountains();
  });

  // ── Stars ────────────────────────────────────────────────────
  const stars = Array.from({length: 400}, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.75,
    r: Math.random() * 1.2 + 0.2,
    a: Math.random(),
    speed: Math.random() * 0.003 + 0.001,
    phase: Math.random() * Math.PI * 2,
  }));

  // ── Snowflakes ───────────────────────────────────────────────
  const flakes = Array.from({length: 180}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 2 + 0.5,
    vx: (Math.random()-0.5) * 0.6,
    vy: Math.random() * 0.8 + 0.3,
    a: Math.random() * 0.7 + 0.2,
  }));

  // ── Aurora bands ─────────────────────────────────────────────
  const AURORA_BANDS = 5;
  const auroras = Array.from({length: AURORA_BANDS}, (_, i) => ({
    points: 12,
    yBase: H * (0.15 + i * 0.06),
    hue: [160, 180, 200, 140, 170][i],
    hue2: [200, 260, 280, 180, 220][i],
    alpha: 0.04 + i * 0.01,
    speed: 0.0008 + i * 0.0003,
    phase: (i / AURORA_BANDS) * Math.PI * 2,
    amp: 40 + i * 15,
  }));

  // ── Mountains (silhouette) ───────────────────────────────────
  let mountains = [], mountains2 = [];
  function initMountains() {
    mountains  = buildMountain(8,  H*0.55, H*0.82, 0.012);
    mountains2 = buildMountain(12, H*0.62, H*0.88, 0.008);
  }

  function buildMountain(peaks, yMin, yMax, roughness) {
    const pts = [{ x: 0, y: yMax }];
    const step = W / peaks;
    for (let i = 0; i <= peaks; i++) {
      pts.push({
        x: i * step + (Math.random()-0.5) * step * 0.4,
        y: yMin + Math.random() * (yMax - yMin),
      });
    }
    pts.push({ x: W, y: yMax });
    // subdivide for roughness
    for (let pass = 0; pass < 3; pass++) {
      const next = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const mid = {
          x: (pts[i-1].x + pts[i].x) / 2,
          y: (pts[i-1].y + pts[i].y) / 2 + (Math.random()-0.5) * 30 * roughness * W,
        };
        next.push(mid, pts[i]);
      }
      pts.length = 0; pts.push(...next);
    }
    return pts;
  }
  initMountains();

  // ── Ice ground ───────────────────────────────────────────────
  function drawGround() {
    // frozen ground
    const gy = H * 0.82;
    const grad = ctx.createLinearGradient(0, gy, 0, H);
    grad.addColorStop(0,   'rgba(180,220,255,0.15)');
    grad.addColorStop(0.3, 'rgba(140,190,240,0.25)');
    grad.addColorStop(1,   'rgba(80,120,180,0.4)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, gy, W, H - gy);

    // ice cracks
    ctx.strokeStyle = 'rgba(200,230,255,0.08)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 20; i++) {
      const sx = Math.random() * W;
      const sy = gy + Math.random() * (H - gy);
      ctx.beginPath(); ctx.moveTo(sx, sy);
      let x = sx, y = sy;
      for (let j = 0; j < 6; j++) {
        x += (Math.random()-0.5)*60; y += Math.random()*20;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // ── Render loop ──────────────────────────────────────────────
  let frame = 0;
  function draw() {
    frame++;

    // Sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0,   '#000510');
    sky.addColorStop(0.4, '#010d1f');
    sky.addColorStop(0.7, '#021428');
    sky.addColorStop(1,   '#041e3a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stars
    stars.forEach(s => {
      s.phase += s.speed;
      const alpha = 0.3 + Math.sin(s.phase) * 0.3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,230,255,${alpha})`;
      ctx.fill();
    });

    // Aurora borealis
    auroras.forEach(a => {
      a.phase += a.speed;
      const pts = a.points;
      const step = W / (pts - 1);

      for (let layer = 0; layer < 3; layer++) {
        ctx.beginPath();
        for (let i = 0; i < pts; i++) {
          const x = i * step;
          const wave1 = Math.sin(i * 0.6 + a.phase + layer * 0.4) * a.amp;
          const wave2 = Math.sin(i * 0.3 + a.phase * 1.3) * a.amp * 0.5;
          const y = a.yBase + wave1 + wave2;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }

        const height = 80 + layer * 30;
        const grad = ctx.createLinearGradient(0, a.yBase - height, 0, a.yBase + height);
        const h = a.hue + layer * 20;
        grad.addColorStop(0,   `hsla(${h},100%,65%,0)`);
        grad.addColorStop(0.3, `hsla(${h},100%,65%,${a.alpha * (1.5 - layer*0.3)})`);
        grad.addColorStop(0.7, `hsla(${a.hue2},90%,70%,${a.alpha * (1 - layer*0.2)})`);
        grad.addColorStop(1,   `hsla(${a.hue2},100%,65%,0)`);

        ctx.strokeStyle = grad;
        ctx.lineWidth = height;
        ctx.stroke();
      }
    });

    // Far mountains (darker)
    ctx.beginPath();
    ctx.moveTo(0, H);
    mountains2.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(W, H);
    ctx.closePath();
    const mg2 = ctx.createLinearGradient(0, H*0.6, 0, H*0.9);
    mg2.addColorStop(0, 'rgba(10,25,50,0.95)');
    mg2.addColorStop(1, 'rgba(5,15,35,1)');
    ctx.fillStyle = mg2;
    ctx.fill();

    // Near mountains
    ctx.beginPath();
    ctx.moveTo(0, H);
    mountains.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(W, H);
    ctx.closePath();
    const mg1 = ctx.createLinearGradient(0, H*0.5, 0, H*0.85);
    mg1.addColorStop(0, 'rgba(15,35,65,0.98)');
    mg1.addColorStop(1, 'rgba(8,20,45,1)');
    ctx.fillStyle = mg1;
    ctx.fill();

    // Snow caps on mountains
    ctx.beginPath();
    let inSnow = false;
    mountains.forEach((p, i) => {
      const threshold = H * 0.68;
      if (p.y < threshold) {
        if (!inSnow) { ctx.moveTo(p.x, p.y); inSnow = true; }
        else ctx.lineTo(p.x, p.y);
      } else if (inSnow) {
        ctx.lineTo(p.x, threshold);
        inSnow = false;
      }
    });
    ctx.strokeStyle = 'rgba(220,240,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Ground
    drawGround();

    // Snowflakes
    flakes.forEach(f => {
      f.x += f.vx + Math.sin(frame * 0.01 + f.y * 0.01) * 0.3;
      f.y += f.vy;
      if (f.y > H) { f.y = -5; f.x = Math.random() * W; }
      if (f.x > W) f.x = 0;
      if (f.x < 0) f.x = W;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(220,240,255,${f.a})`;
      ctx.fill();
    });

    // Horizon glow
    const hg = ctx.createLinearGradient(0, H*0.75, 0, H*0.85);
    hg.addColorStop(0, 'rgba(100,160,220,0.08)');
    hg.addColorStop(1, 'transparent');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H*0.75, W, H*0.1);

    requestAnimationFrame(draw);
  }
  draw();
  </script>
