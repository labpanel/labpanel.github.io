<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Universe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      cursor: none;
      font-family: 'Courier New', monospace;
    }

    /* Custom Unix-style cursor */
    #cursor {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    #cursor .cursor-outer {
      width: 32px;
      height: 32px;
      border: 1.5px solid #00ff88;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, opacity 0.2s;
      animation: pulse 2s infinite;
    }

    #cursor .cursor-inner {
      width: 4px;
      height: 4px;
      background: #00ff88;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #cursor .cursor-cross::before,
    #cursor .cursor-cross::after {
      content: '';
      position: absolute;
      background: #00ff8866;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #cursor .cursor-cross::before { width: 20px; height: 1px; }
    #cursor .cursor-cross::after  { width: 1px; height: 20px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 0.4; transform: translate(-50%, -50%) scale(1.3); }
    }

    /* Canvas for 3D background */
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* UI overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .title {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #fff;
      text-shadow:
        0 0 20px #00ff88,
        0 0 60px #00ff8844;
      animation: flicker 4s infinite;
    }

    .subtitle {
      margin-top: 1rem;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      color: #00ff88aa;
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }

    .terminal-line {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #00ff88;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .terminal-line span.blink {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: #00ff88;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96%           { opacity: 0.7; }
      97%           { opacity: 1; }
      98%           { opacity: 0.5; }
      99%           { opacity: 1; }
    }

    /* Scanline effect */
    .scanlines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 5;
    }

    /* Corner decorations */
    .corner {
      position: fixed;
      width: 60px;
      height: 60px;
      pointer-events: none;
      z-index: 20;
    }
    .corner.tl { top: 20px; left: 20px; border-top: 1px solid #00ff88; border-left: 1px solid #00ff88; }
    .corner.tr { top: 20px; right: 20px; border-top: 1px solid #00ff88; border-right: 1px solid #00ff88; }
    .corner.bl { bottom: 20px; left: 20px; border-bottom: 1px solid #00ff88; border-left: 1px solid #00ff88; }
    .corner.br { bottom: 20px; right: 20px; border-bottom: 1px solid #00ff88; border-right: 1px solid #00ff88; }

    /* Status bar */
    .statusbar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      font-size: 0.7rem;
      color: #00ff8866;
      letter-spacing: 0.2em;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>
  <div class="scanlines"></div>

  <!-- Cursor -->
  <div id="cursor">
    <div class="cursor-cross"></div>
    <div class="cursor-outer"></div>
    <div class="cursor-inner"></div>
  </div>

  <!-- Corner decorations -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Main content -->
  <div class="overlay">
    <div class="title">UNIVERSE</div>
    <div class="subtitle">Explore the infinite void</div>
    <div class="terminal-line">
      <span>root@cosmos:~$</span>
      <span id="typed"></span>
      <span class="blink"></span>
    </div>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <span id="coords">X: 0 Y: 0</span>
    <span>SYS: ONLINE</span>
    <span id="clock"></span>
  </div>

  <script>
    // ── Cursor tracking ──────────────────────────────────────────
    const cursor = document.getElementById('cursor');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let cx = mx, cy = my;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      document.getElementById('coords').textContent = `X: ${mx} Y: ${my}`;
    });

    function animateCursor() {
      cx += (mx - cx) * 0.12;
      cy += (my - cy) * 0.12;
      cursor.style.left = cx + 'px';
      cursor.style.top  = cy + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // ── Clock ────────────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toTimeString().slice(0,8);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Typing effect ────────────────────────────────────────────
    const phrases = [
      'initializing deep space scan...',
      'connecting to stellar network...',
      'loading particle engine...',
      'traversing the cosmos...',
    ];
    let pi = 0, ci = 0, deleting = false;
    const typedEl = document.getElementById('typed');

    function type() {
      const phrase = phrases[pi];
      if (!deleting) {
        typedEl.textContent = phrase.slice(0, ++ci);
        if (ci === phrase.length) { deleting = true; setTimeout(type, 1800); return; }
      } else {
        typedEl.textContent = phrase.slice(0, --ci);
        if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; }
      }
      setTimeout(type, deleting ? 40 : 70);
    }
    type();

    // ── 3D Particle / Star field ─────────────────────────────────
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let W = canvas.width  = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    // Stars
    const STAR_COUNT = 600;
    const stars = Array.from({ length: STAR_COUNT }, () => ({
      x: (Math.random() - 0.5) * W * 3,
      y: (Math.random() - 0.5) * H * 3,
      z: Math.random() * W,
      pz: 0,
    }));

    // Nebula particles
    const NEBULA_COUNT = 120;
    const nebula = Array.from({ length: NEBULA_COUNT }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 180 + 60,
      hue: Math.random() < 0.5 ? 160 : 260,
      alpha: Math.random() * 0.06 + 0.02,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
    }));

    // Floating orbs
    const ORBS = Array.from({ length: 6 }, (_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 80 + 40,
      hue: [160, 200, 260, 300, 180, 140][i],
      speed: Math.random() * 0.003 + 0.001,
      angle: Math.random() * Math.PI * 2,
      ox: Math.random() * W,
      oy: Math.random() * H,
      orbit: Math.random() * 120 + 60,
    }));

    let speed = 8;
    let frame = 0;

    function draw() {
      frame++;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0, 0, W, H);

      // Nebula blobs
      nebula.forEach(n => {
        n.x += n.vx; n.y += n.vy;
        if (n.x < -n.r) n.x = W + n.r;
        if (n.x > W + n.r) n.x = -n.r;
        if (n.y < -n.r) n.y = H + n.r;
        if (n.y > H + n.r) n.y = -n.r;

        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
        g.addColorStop(0, `hsla(${n.hue},100%,60%,${n.alpha})`);
        g.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
      });

      // Floating orbs
      ORBS.forEach(o => {
        o.angle += o.speed;
        const x = o.ox + Math.cos(o.angle) * o.orbit;
        const y = o.oy + Math.sin(o.angle) * o.orbit;
        const g = ctx.createRadialGradient(x, y, 0, x, y, o.r);
        g.addColorStop(0, `hsla(${o.hue},100%,70%,0.12)`);
        g.addColorStop(0.5, `hsla(${o.hue},100%,50%,0.05)`);
        g.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(x, y, o.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
      });

      // Star warp
      const cx2 = W / 2, cy2 = H / 2;
      stars.forEach(s => {
        s.pz = s.z;
        s.z -= speed;
        if (s.z <= 0) {
          s.x = (Math.random() - 0.5) * W * 3;
          s.y = (Math.random() - 0.5) * H * 3;
          s.z = W;
          s.pz = s.z;
        }

        const sx  = (s.x / s.z)  * W + cx2;
        const sy  = (s.y / s.z)  * H + cy2;
        const px  = (s.x / s.pz) * W + cx2;
        const py  = (s.y / s.pz) * H + cy2;
        const size = Math.max(0.3, (1 - s.z / W) * 2.5);
        const bright = 1 - s.z / W;

        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = `rgba(${Math.floor(180 + bright * 75)},${Math.floor(220 + bright * 35)},255,${bright * 0.9})`;
        ctx.lineWidth = size;
        ctx.stroke();
      });

      // Grid lines (subtle)
      if (frame % 2 === 0) {
        ctx.strokeStyle = 'rgba(0,255,136,0.03)';
        ctx.lineWidth = 1;
        const gridSize = 80;
        const offset = (frame * 0.3) % gridSize;
        for (let x = -gridSize + offset; x < W + gridSize; x += gridSize) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = -gridSize + offset; y < H + gridSize; y += gridSize) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }
      }

      requestAnimationFrame(draw);
    }
    draw();

    // Speed up on mouse move
    document.addEventListener('mousemove', () => {
      speed = 14;
      clearTimeout(window._speedTimer);
      window._speedTimer = setTimeout(() => speed = 8, 300);
    });
  </script>
</body>
</html>
